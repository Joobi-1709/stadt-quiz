    body {

      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;

    .progress {
      font-size: 14px;

      margin-bottom: 15px;

    }

      font-size: 22px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .btn {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      margin: 8px 0;
      width: 100%;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: block;
      box-sizing: border-box;
      color: #4a5568;
    }

    .btn:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .result {

    }

    }

    .result-title {

      margin-top: 15px;
      text-align: left;
    }

    .restart-btn {
      background: #764ba2;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      margin-top: 25px;
      cursor: pointer;
      font-size: 16px;
    }

    .restart-btn:hover {
      opacity: 0.9;
    }

    .score-box {
      margin-top: 25px;
      padding: 15px;
      background: #f7fafc;
      border-radius: 12px;
      text-align: left;
    }

    .score-box h3 {
      margin-top: 0;
      color: #2d3748;
    }

    .score-line {

</head>

/* =========================================================

/* =========================================================
   PUNKTE
   ========================================================= */

let currentQ = 0;

let scores = {};

Object.keys(results).forEach(city => {
  scores[city] = 0;
});


/* =========================================================
   FRAGE ANZEIGEN
   ========================================================= */

function showQuestion() {

  const q = questions[currentQ];

  document.getElementById("progress").innerText =
    `Frage ${currentQ + 1} von ${questions.length}`;

  document.getElementById("question").innerText = q.q;

  const answersDiv = document.getElementById("answers");

  answersDiv.innerHTML = "";

  q.a.forEach(ans => {

    const btn = document.createElement("button");

    btn.className = "btn";

    btn.innerText = ans.text;

    btn.onclick = () => selectAnswer(ans.points);

    answersDiv.appendChild(btn);

  });
}


/* =========================================================
   ANTWORT AUSWERTEN
   ========================================================= */

function selectAnswer(points) {

  Object.keys(points).forEach(city => {

    if (scores[city] !== undefined) {
      scores[city] += points[city];
    }

  });

  currentQ++;

  if (currentQ < questions.length) {

    showQuestion();

  } else {

    showResult();

  }
}


/* =========================================================
   ERGEBNIS ANZEIGEN
   ========================================================= */

function showResult() {

  document.getElementById("quiz").style.display = "none";

  document.getElementById("result").style.display = "block";


  /* Städte nach Punkten sortieren */

  const sortedCities = Object.keys(scores).sort(
    (a, b) => scores[b] - scores[a]
  );


  const topType = sortedCities[0];

  const res = results[topType];


  document.getElementById("flag").innerText = res.flag;

  document.getElementById("place").innerText =
    "Dein perfekter Ort ist: " + res.name;

  document.getElementById("desc").innerText =
    res.desc;


  /* Punkteliste */

  const scoresDiv = document.getElementById("scores");

  scoresDiv.innerHTML = "";


  sortedCities.forEach(city => {

    if (scores[city] > 0) {

      const line = document.createElement("div");

      line.className = "score-line";

      line.innerText =
        `${results[city].name}: ${scores[city]} Punkte`;

      scoresDiv.appendChild(line);

    }

  });

}


/* =========================================================
   START
   ========================================================= */

showQuestion();
